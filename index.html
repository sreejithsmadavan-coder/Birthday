<style>
:root{
  --ink:#17120E; --gold:#C9A227; --gold-lt:#EFD992; --gold-dk:#7A5E1B;
  --cream:#F3EBDC; --muted:#C4B394;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --inset:22px;
  --ease:cubic-bezier(.19,1,.22,1);
}
@media (max-width:600px){ :root{ --inset:13px; } }

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  min-height:100svh;
  background:
    radial-gradient(115% 60% at 50% 0%,#2A1E14 0%,transparent 50%),
    radial-gradient(100% 55% at 50% 100%,#211810 0%,transparent 56%),
    var(--ink);
  color:var(--cream); font-family:var(--sans); font-weight:300;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{ background:var(--gold-dk); color:#fff; }
:focus-visible{ outline:1.5px solid var(--gold-lt); outline-offset:6px; }

/* ---------- PARTICLES ---------- */
#motes{ position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
.mote{ position:absolute; border-radius:50%;
  background:radial-gradient(circle,var(--gold-lt) 0%,rgba(239,217,146,0) 70%);
  animation:drift linear infinite; }
@keyframes drift{
  0%{ transform:translate3d(0,14vh,0) scale(.6); opacity:0; }
  10%{ opacity:1; } 86%{ opacity:1; }
  100%{ transform:translate3d(18px,-112vh,0) scale(1.15); opacity:0; }
}
.spark{ position:absolute; width:2px; height:2px; border-radius:50%;
  background:var(--gold-lt); box-shadow:0 0 6px 2px rgba(239,217,146,.5);
  animation:sparkle ease-in-out infinite; }
@keyframes sparkle{ 0%,100%{ opacity:0; transform:scale(.4); }
  50%{ opacity:.85; transform:scale(1.5); } }

/* ---------- FRAME ---------- */
#frame{ position:fixed; inset:0; pointer-events:none; z-index:40; opacity:0; transition:opacity .4s; }
#frame.on{ opacity:1; }
.fl{ position:absolute; background:var(--gold-dk); }
.fl-t,.fl-b{ height:1px; left:var(--inset); right:var(--inset); transform:scaleX(0); }
.fl-l,.fl-r{ width:1px; top:var(--inset); bottom:var(--inset); transform:scaleY(0); }
.fl-t{ top:var(--inset); transform-origin:left center; }
.fl-r{ right:var(--inset); transform-origin:center top; }
.fl-b{ bottom:var(--inset); transform-origin:right center; }
.fl-l{ left:var(--inset); transform-origin:center bottom; }
#frame.on .fl-t{ animation:dX .8s var(--ease) .05s forwards; }
#frame.on .fl-r{ animation:dY .8s var(--ease) .5s forwards; }
#frame.on .fl-b{ animation:dX .8s var(--ease) .95s forwards; }
#frame.on .fl-l{ animation:dY .8s var(--ease) 1.4s forwards; }
@keyframes dX{ to{ transform:scaleX(1); } }
@keyframes dY{ to{ transform:scaleY(1); } }
.corner{ position:absolute; width:5px; height:5px; background:var(--gold);
  transform:rotate(45deg) scale(0); opacity:0; }
#frame.on .corner{ animation:cIn .6s var(--ease) 2.05s forwards; }
@keyframes cIn{ to{ transform:rotate(45deg) scale(1); opacity:.85; } }
.c-tl{ top:calc(var(--inset) - 2px); left:calc(var(--inset) - 2px); }
.c-tr{ top:calc(var(--inset) - 2px); right:calc(var(--inset) - 2px); }
.c-bl{ bottom:calc(var(--inset) - 2px); left:calc(var(--inset) - 2px); }
.c-br{ bottom:calc(var(--inset) - 2px); right:calc(var(--inset) - 2px); }

/* ---------- ENVELOPE ---------- */
#scene{ position:fixed; inset:0; display:grid; place-items:center; padding:24px; z-index:50;
  transition:opacity .8s, transform .8s var(--ease); }
#scene.dissolve{ opacity:0; transform:scale(1.08); pointer-events:none; }
.env-stage{ perspective:1400px; display:flex; flex-direction:column; align-items:center; gap:40px; }
.env-stage::before{ content:""; position:absolute; width:min(600px,116vw); aspect-ratio:1;
  background:radial-gradient(circle,rgba(201,162,39,.13),transparent 62%); pointer-events:none; }
.envelope{ position:relative; width:min(350px,78vw); aspect-ratio:1.52/1; transform-style:preserve-3d;
  cursor:pointer; border:0; background:none; padding:0; display:block;
  filter:drop-shadow(0 26px 46px rgba(0,0,0,.62)); transition:transform .5s var(--ease); }
.envelope:hover{ transform:translateY(-5px); }
.envelope.opened,.envelope.opened:hover{ cursor:default; transform:none; }
.env-back,.env-front,.env-flap{ position:absolute; left:0; width:100%; }
.env-back{ top:0; height:100%; background:linear-gradient(158deg,#221913,#17110C 52%,#0F0B07);
  border-radius:3px; z-index:1; }
.letter{ position:absolute; left:5%; bottom:6%; width:90%; height:88%; z-index:3;
  background:linear-gradient(172deg,#F6EFE1,#E8DCC6); border-radius:2px;
  box-shadow:0 -6px 22px rgba(0,0,0,.34); display:grid; place-items:center; }
.letter-mark{ font-family:var(--serif); font-size:2.6rem; color:var(--gold-dk); opacity:.6; }
.env-front{ top:0; height:100%; background:linear-gradient(168deg,#2A1F16,#1B140E 58%,#120D09);
  clip-path:polygon(0 0,50% 47%,100% 0,100% 100%,0 100%); border-radius:3px; z-index:4; }
.env-front::after{ content:""; position:absolute; inset:0;
  background:linear-gradient(168deg,rgba(201,162,39,.16),transparent 42%);
  clip-path:polygon(0 0,50% 47%,100% 0,100% 100%,0 100%); }
.env-flap{ top:0; height:52%; background:linear-gradient(178deg,#33251A,#20180F);
  clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top center; transform:rotateX(0);
  backface-visibility:hidden; z-index:6; }
.env-flap::after{ content:""; position:absolute; inset:0;
  background:linear-gradient(178deg,rgba(239,217,146,.34) 0 1px,transparent 1px);
  clip-path:polygon(0 0,100% 0,50% 100%); }
.seal{ position:absolute; left:50%; top:44%; width:70px; height:70px; margin:-35px 0 0 -35px;
  border-radius:50%; z-index:7;
  background:radial-gradient(circle at 34% 30%,#E0BE55,#C9A227 34%,#97741C 72%,#6E5314);
  box-shadow:0 3px 12px rgba(0,0,0,.55),inset 0 1px 2px rgba(255,240,196,.55),inset 0 -3px 7px rgba(60,42,8,.6);
  display:grid; place-items:center; }
.seal span{ font-family:var(--serif); font-size:1.9rem; font-weight:400; color:#3A2B0A; line-height:1; }
.hint{ font-size:.76rem; letter-spacing:.24em; color:var(--muted); transition:opacity .4s; }
.hint.gone{ opacity:0; }
.envelope.opened .seal{ animation:sealBreak .5s cubic-bezier(.5,0,.75,0) forwards; }
@keyframes sealBreak{ 40%{ transform:scale(1.13) rotate(-7deg); }
  100%{ transform:scale(.7) rotate(16deg) translateY(26px); opacity:0; } }
.envelope.opened .env-flap{ animation:flap 1s cubic-bezier(.65,.02,.28,1) .34s forwards; }
@keyframes flap{ 0%{ transform:rotateX(0); z-index:6; } 49%{ z-index:6; } 50%{ z-index:0; }
  100%{ transform:rotateX(-176deg); z-index:0; } }
.envelope.opened .letter{ animation:rise 1.05s var(--ease) 1s forwards; }
@keyframes rise{ 0%{ transform:translateY(0) scale(1); } 62%{ transform:translateY(-78%); }
  100%{ transform:translateY(-92%) scale(1.05); } }

/* ============================================================
   INVITATION
   ============================================================ */
#invite{ position:relative; z-index:5; opacity:0; visibility:hidden; transition:opacity 1s;
  max-width:560px; margin-inline:auto;
  padding-inline:clamp(28px,7.5vw,40px);
  padding-bottom:clamp(48px,8vh,80px);
  text-align:center; }
#invite.shown{ opacity:1; visibility:visible; }

.mask{ display:block; overflow:hidden; padding-bottom:.1em; }
.mask>span{ display:block; transform:translateY(114%);
  transition:transform 1.15s var(--ease) var(--d,0s); }
.in .mask>span,.mask.in>span,.lit .mask>span{ transform:translateY(0); }
.rv{ opacity:0; transform:translateY(16px);
  transition:opacity .9s ease var(--d,0s),transform 1.05s var(--ease) var(--d,0s); }
.rv.in,.in .rv,.lit .rv{ opacity:1; transform:none; }

/* ---------- HERO : one screen, one story ---------- */
.hero{
  min-height:100svh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding-block:clamp(38px,6vh,64px) clamp(20px,3vh,32px);
  gap:0;
}

/* teddy — the little guest of honour */
.cake-wrap{ position:relative; height:clamp(58px,8.2vh,74px); width:100%;
  display:flex; align-items:flex-end; justify-content:center; }
.cake-wrap::after{ content:""; position:absolute; left:50%; bottom:14%;
  width:170px; height:170px; transform:translateX(-50%); z-index:-1; pointer-events:none;
  background:radial-gradient(circle,rgba(201,162,39,.18) 0%,transparent 62%);
  opacity:0; transition:opacity 1.4s ease 1.1s; }
.lit .cake-wrap::after{ opacity:1; }

.cake{ height:100%; width:auto; display:block; overflow:visible; }

.cake-body{ transform-box:fill-box; transform-origin:50% 100%;
  transform:translateY(26%) scale(.9); opacity:0;
  transition:transform 1s var(--ease) .2s, opacity .8s ease .2s; }
.lit .cake-body{ transform:none; opacity:1; }

.cake-flame,.cake-core{ transform-box:fill-box; transform-origin:50% 100%;
  transform:scale(0); opacity:0; }
.lit .cake-flame{ animation:ignite .9s var(--ease) 1.05s forwards,
                            flicker 3.4s ease-in-out 1.95s infinite; }
.lit .cake-core{ animation:coreIn .55s ease 1.3s forwards,
                           coreFlick 3.4s ease-in-out 1.95s infinite; }

@keyframes ignite{
  0%{ transform:scale(0); opacity:0; filter:none; }
  38%{ transform:scale(1.5); opacity:1;
       filter:drop-shadow(0 0 14px rgba(243,208,107,.95)) drop-shadow(0 0 32px rgba(201,162,39,.6)); }
  100%{ transform:scale(1); opacity:1;
        filter:drop-shadow(0 0 7px rgba(243,208,107,.8)) drop-shadow(0 0 19px rgba(201,162,39,.42)); }
}
@keyframes coreIn{ to{ transform:scale(1); opacity:.95; } }
@keyframes flicker{
  0%,100%{ transform:scale(1) skewX(0deg); }
  22%{ transform:scaleY(1.12) skewX(-3deg); }
  47%{ transform:scaleY(.91) skewX(2deg); }
  71%{ transform:scaleY(1.06) skewX(-1.2deg); }
}
@keyframes coreFlick{
  0%,100%{ transform:scale(1); opacity:.95; }
  30%{ transform:scaleY(1.15); opacity:1; }
  62%{ transform:scaleY(.88); opacity:.85; }
}

.ember{ position:absolute; bottom:86%; left:50%; width:2px; height:2px;
  border-radius:50%; background:var(--gold-lt); opacity:0; }
.lit .ember{ animation:emberUp 3.4s ease-out infinite; }
@keyframes emberUp{ 0%{ transform:translate(0,0) scale(1); opacity:0; }
  16%{ opacity:.8; } 100%{ transform:translate(var(--x,6px),-38px) scale(.2); opacity:0; } }
.e1{ animation-delay:2.3s !important; --x:-7px; }
.e2{ animation-delay:3.4s !important; --x:5px; }
.e3{ animation-delay:4.5s !important; --x:-3px; }

/* portrait — sized against BOTH width and height so it never pushes the message down */
.portrait{ position:relative; margin-top:clamp(8px,1.4vh,14px);
  width:min(186px, 44vw, 23vh); }
.portrait-ring{ padding:6px; border:1px solid rgba(201,162,39,.5);
  border-radius:50% 50% 5px 5px / 40% 40% 1% 1%;
  background:linear-gradient(180deg,rgba(201,162,39,.10),rgba(201,162,39,0) 62%);
  opacity:0; transform:scale(.93);
  transition:opacity 1s ease .35s, transform 1.2s var(--ease) .35s; }
.lit .portrait-ring{ opacity:1; transform:scale(1); }
.portrait img{ display:block; width:100%; height:auto;
  border-radius:50% 50% 3px 3px / 40% 40% 1% 1%;
  -webkit-mask-image:linear-gradient(180deg,#000 76%,rgba(0,0,0,0) 99%);
  mask-image:linear-gradient(180deg,#000 76%,rgba(0,0,0,0) 99%);
  clip-path:inset(0 0 100% 0); transition:clip-path 1.4s var(--ease) .5s; }
.lit .portrait img{ clip-path:inset(0 0 0 0); }
.portrait::after{ content:""; position:absolute; left:50%; top:44%; width:240%; aspect-ratio:1;
  transform:translate(-50%,-50%); z-index:-1; pointer-events:none;
  background:radial-gradient(circle,rgba(201,162,39,.17) 0%,transparent 58%); }
.twinkle{ position:absolute; width:13px; height:13px; opacity:0; pointer-events:none;
  background:var(--gold-lt);
  clip-path:polygon(50% 0%,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0% 50%,43% 43%);
  filter:drop-shadow(0 0 5px rgba(239,217,146,.75)); }
.lit .twinkle{ animation:tw 4s ease-in-out infinite; }
@keyframes tw{ 0%,100%{ opacity:0; transform:scale(.25) rotate(-25deg); }
  50%{ opacity:.9; transform:scale(1) rotate(0deg); } }
.tw1{ top:16%; right:-15px; animation-delay:2.2s !important; }
.tw2{ top:62%; left:-16px;  animation-delay:3.5s !important; }
.tw3{ top:90%; right:-11px; animation-delay:4.8s !important; }

/* copy — tight stack */
.name{ margin-top:clamp(16px,2.4vh,24px); font-family:var(--serif); font-weight:400;
  font-size:clamp(1.75rem,7.2vw,2.6rem); letter-spacing:.03em; line-height:1.1; color:#FBF5E9; }
.turns{ margin-top:clamp(8px,1.4vh,14px); font-family:var(--serif); font-style:italic;
  font-weight:300; font-size:clamp(.95rem,3.4vw,1.15rem); letter-spacing:.06em; color:var(--muted); }
.one{ display:flex; justify-content:center; margin-top:clamp(-4px,-.4vh,0px);
  font-family:var(--serif); font-weight:300;
  font-size:clamp(5rem,24vw,9.5rem); line-height:.95; letter-spacing:-.015em; }
.gl{ display:block; overflow:hidden; padding:0 .012em .1em; }
.gi{ display:block; transform:translateY(114%);
  transition:transform 1.2s var(--ease) var(--d,0s);
  background:linear-gradient(102deg,var(--gold-dk) 6%,var(--gold) 26%,var(--gold-lt) 42%,
    #FFF9E6 50%,var(--gold-lt) 58%,var(--gold) 74%,var(--gold-dk) 94%);
  background-size:280% 100%; background-position:110% 0;
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.lit .gi{ transform:translateY(0); }
.one.sheening .gi{ animation:sheen 8s ease-in-out infinite; }
@keyframes sheen{ 0%,58%,100%{ background-position:110% 0; } 30%{ background-position:-25% 0; } }

.parents{ margin-top:clamp(14px,2.2vh,22px); font-size:clamp(.74rem,2.9vw,.82rem);
  font-weight:200; letter-spacing:.17em; line-height:1.6; color:var(--muted); }

.cue{ margin-top:clamp(18px,3vh,30px); display:flex; flex-direction:column; align-items:center;
  gap:9px; opacity:0; transition:opacity .8s; }
.cue.on{ opacity:1; } .cue.off{ opacity:0; }
.cue span{ font-size:.64rem; font-weight:200; letter-spacing:.26em; color:var(--muted); }
.cue i{ display:block; width:1px; height:30px;
  background:linear-gradient(180deg,var(--gold-dk),transparent);
  animation:cueS 2.6s ease-in-out infinite; }
@keyframes cueS{ 0%,100%{ transform:scaleY(.4); transform-origin:top; opacity:.5; }
  50%{ transform:scaleY(1); transform-origin:top; opacity:1; } }

/* ---------- ornament ---------- */
.orn{ display:block; width:min(200px,54vw); height:18px; margin:0 auto; overflow:visible; }
.orn line{ stroke:var(--gold-dk); stroke-width:1; stroke-dasharray:90; stroke-dashoffset:90;
  transition:stroke-dashoffset 1.2s var(--ease) .1s; }
.in .orn line{ stroke-dashoffset:0; }
.orn rect{ fill:none; stroke:var(--gold); stroke-width:1; transform-box:fill-box;
  transform-origin:center; transform:rotate(45deg) scale(0);
  transition:transform .65s var(--ease) .7s; }
.in .orn rect{ transform:rotate(45deg) scale(1); }

/* ---------- detail plates ---------- */
.details{ margin-top:clamp(26px,4vh,38px); display:grid; gap:16px; }
.block{ padding:24px 18px 22px; border:1px solid rgba(201,162,39,.26);
  background:linear-gradient(180deg,rgba(201,162,39,.08),rgba(201,162,39,.02));
  border-radius:3px; }
.block .label{ font-size:.73rem; font-weight:400; letter-spacing:.28em; color:var(--gold); }
.block .primary{ margin-top:11px; font-family:var(--serif); font-weight:400;
  font-size:clamp(1.42rem,5.8vw,1.85rem); letter-spacing:.015em; line-height:1.24; color:#FCF7EC; }
.block .secondary{ margin-top:9px; font-size:clamp(.94rem,3.6vw,1rem); font-weight:300;
  line-height:1.6; color:#DACAA8; }

.closing{ margin-top:clamp(30px,4.6vh,42px); font-family:var(--serif); font-style:italic;
  font-weight:300; font-size:clamp(1.02rem,4vw,1.14rem); color:var(--muted); }

/* directions control — lives inside the venue plate */
.maplink{ display:inline-block; margin-top:18px; padding:14px 24px;
  border:1px solid rgba(201,162,39,.45); border-radius:2px;
  font-size:.78rem; font-weight:300; letter-spacing:.18em;
  color:var(--gold-lt); text-decoration:none; background:transparent;
  transition:background .3s ease, border-color .3s ease, color .3s ease; }
.maplink:hover,.maplink:focus-visible{ background:rgba(201,162,39,.12);
  border-color:var(--gold-lt); color:#FFF4D8; }

/* signature close */
.signature{ margin-top:clamp(28px,4.4vh,40px); padding-top:26px;
  border-top:1px solid rgba(122,94,27,.32); }
.signature .label{ font-size:.73rem; font-weight:400; letter-spacing:.28em; color:var(--gold); }
.signature .names{ margin-top:13px; font-family:var(--serif); font-weight:400;
  font-size:clamp(1.28rem,5.2vw,1.6rem); letter-spacing:.03em; color:#FBF5E9; }

/* ---------- short-screen safety valve ---------- */
@media (max-height:640px){
  .hero{ padding-block:26px 14px; }
  .cake-wrap{ height:50px; }
  .portrait{ margin-top:6px; width:min(132px,34vw); }
  .name{ margin-top:12px; font-size:clamp(1.55rem,6.4vw,2rem); }
  .turns{ margin-top:6px; }
  .one{ font-size:clamp(3.8rem,19vw,6rem); }
  .parents{ margin-top:10px; }
  .cue{ margin-top:12px; gap:6px; }
  .cue i{ height:24px; }
}

/* sound toggle */
.sound{ position:fixed; top:calc(var(--inset) + 12px); right:calc(var(--inset) + 12px);
  z-index:60; width:38px; height:38px; display:grid; place-items:center;
  padding:0; cursor:pointer; -webkit-appearance:none; appearance:none;
  border:1px solid rgba(201,162,39,.34); border-radius:50%;
  background:rgba(23,18,14,.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  color:var(--gold); opacity:0; transform:scale(.82); pointer-events:none;
  transition:opacity .9s ease, transform .9s var(--ease), border-color .3s ease; }
.sound.show{ opacity:.66; transform:none; pointer-events:auto; }
.sound.show:hover,.sound.show:focus-visible{ opacity:1; border-color:rgba(201,162,39,.7); }
.sound svg{ width:19px; height:19px; fill:none; stroke:currentColor;
  stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.sound .spk{ fill:currentColor; stroke:none; }
.sound .wav,.sound .xmark{ transition:opacity .25s ease; }
.sound .xmark{ opacity:0; }
.sound[aria-pressed="true"] .wav{ opacity:0; }
.sound[aria-pressed="true"] .xmark{ opacity:1; }

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .mote,.spark,.ember{ display:none; }
  .cake-flame,.cake-core{ transform:scale(1); opacity:1;
    filter:drop-shadow(0 0 7px rgba(243,208,107,.7)); }
  .lit .cake-flame,.lit .cake-core{ animation:none; }
  .cake-body,.lit .cake-body{ transform:none; opacity:1; transition:none; }
  .cake-wrap::after,.lit .cake-wrap::after{ opacity:1; transition:none; }
  .gi{ transform:none; transition:none; background-position:30% 0; }
  .one.sheening .gi{ animation:none; }
  .mask>span,.rv{ transform:none; opacity:1; transition:none; }
  .portrait-ring,.lit .portrait-ring{ opacity:1; transform:none; transition:none; }
  .portrait img,.lit .portrait img{ clip-path:none; transition:none; }
  .lit .twinkle{ animation:none; opacity:.45; }
  .orn line{ stroke-dashoffset:0; transition:none; }
  .orn rect{ transform:rotate(45deg) scale(1); transition:none; }
  .cue i{ animation:none; }
  #frame .fl-t,#frame .fl-b{ transform:scaleX(1); animation:none; }
  #frame .fl-l,#frame .fl-r{ transform:scaleY(1); animation:none; }
  #frame .corner{ transform:rotate(45deg) scale(1); opacity:.85; animation:none; }
  .envelope.opened .seal{ animation:none; opacity:0; }
  .envelope.opened .env-flap{ animation:none; transform:rotateX(-176deg); z-index:0; }
  .envelope.opened .letter{ animation:none; }
  #scene,#invite{ transition-duration:.25s; }
}
@media (max-width:360px){ .seal{ width:62px; height:62px; margin:-31px 0 0 -31px; } }
</style>
</head>
<body>

<!-- ============ EDIT EVERYTHING HERE ============ -->
<script>
const INVITE = {
  monogram:   "R",
  childName:  "Rithudev S",
  turnsLine:  "turns",
  heroWord:   "One",
  parents:    "Sreejith &amp; Aswathy invite you to share the day",

  dateLabel:  "Date",
  dateMain:   "Sunday, 13 September 2026",
  dateSub:    "4:30 in the afternoon",

  venueLabel: "Venue",
  venueMain:  "Kadayal Panchayat Auditorium",
  venueSub:   "Kadayal, Kanyakumari",

  directionsLabel: "Get directions",
  mapUrl:     "https://maps.app.goo.gl/8vZ6QLdFpHwgTYCc6",   // exact pin
  mapQuery:   "Kadayal Panchayat Auditorium, Kadayal, Tamil Nadu",  // fallback if mapUrl is blank

  closing:    "Dinner will follow.",

  signOff:    "With love",

</script>

<div id="motes" aria-hidden="true"></div>

<div id="scene">

      <div class="env-back"></div>

<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Mute the music">

</button>

<main id="invite" aria-hidden="true">

  <section class="hero" id="hero">

    <div class="cake-wrap">
      <svg class="cake" viewBox="0 4 80 72" role="img" aria-label="A teddy bear">
        <defs>
          <linearGradient id="cakeG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#6E5314"/>
            <stop offset="26%"  stop-color="#D9B84B"/>
            <stop offset="50%"  stop-color="#C9A227"/>
            <stop offset="76%"  stop-color="#96761F"/>
            <stop offset="100%" stop-color="#6E5314"/>
          </linearGradient>
          <linearGradient id="icingG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#9A7A20"/>
            <stop offset="28%"  stop-color="#EFD992"/>
            <stop offset="55%"  stop-color="#E3C77F"/>
            <stop offset="100%" stop-color="#9A7A20"/>
          </linearGradient>
          <radialGradient id="flameG" cx="50%" cy="80%" r="62%">
            <stop offset="0%"   stop-color="#FFF8E4"/>
            <stop offset="32%"  stop-color="#F5D473"/>
            <stop offset="68%"  stop-color="#C9A227"/>
            <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <g class="cake-body">
          <g fill="url(#cakeG)">
            <ellipse cx="27" cy="67.5" rx="8.6" ry="6.8"/>
            <ellipse cx="53" cy="67.5" rx="8.6" ry="6.8"/>
            <ellipse cx="22.5" cy="50" rx="6.2" ry="9" transform="rotate(-22 22.5 50)"/>
            <ellipse cx="57.5" cy="50" rx="6.2" ry="9" transform="rotate(22 57.5 50)"/>
            <ellipse cx="40" cy="55" rx="15.2" ry="14.2"/>
            <circle cx="26" cy="17" r="8.6"/>
            <circle cx="54" cy="17" r="8.6"/>
            <ellipse cx="40" cy="27.5" rx="17" ry="15"/>
          </g>

          <g fill="#5E4712" opacity=".45">
            <ellipse cx="40" cy="41.6" rx="11.5" ry="1.5"/>
          </g>

          <g fill="url(#icingG)">
            <circle cx="26" cy="17" r="4.4"/>
            <circle cx="54" cy="17" r="4.4"/>
            <ellipse cx="40" cy="57.5" rx="9.2" ry="8.6"/>
            <ellipse cx="27" cy="68.5" rx="4.6" ry="3.6"/>
            <ellipse cx="53" cy="68.5" rx="4.6" ry="3.6"/>
            <ellipse cx="40" cy="32.4" rx="8.6" ry="6.4"/>
          </g>

          <g fill="url(#icingG)">
            <path d="M40 43.6 L31.6 39.9 V47.3 Z"/>
            <path d="M40 43.6 L48.4 39.9 V47.3 Z"/>
            <circle cx="40" cy="43.6" r="2.2"/>
          </g>

          <g fill="#3A2E1C">
            <ellipse cx="33.4" cy="24.6" rx="2.05" ry="2.25"/>
            <ellipse cx="46.6" cy="24.6" rx="2.05" ry="2.25"/>
            <ellipse cx="40" cy="29.6" rx="2.7" ry="2.05"/>
          </g>
          <path d="M40 31.6 v2.1 M40 33.7 q-2.5 2.1 -4.5 .1 M40 33.7 q2.5 2.1 4.5 .1"
                fill="none" stroke="#3A2E1C" stroke-width="1.1"
                stroke-linecap="round" stroke-linejoin="round"/>

          <g fill="#FFF8E4" opacity=".9">
            <circle cx="32.6" cy="23.8" r=".62"/>
            <circle cx="45.8" cy="23.8" r=".62"/>
          </g>
        </g>
      </svg>
      <i class="ember e1"></i><i class="ember e2"></i><i class="ember e3"></i>
    </div>

    <div class="portrait">
      <div class="portrait-ring"><img id="heroPhoto" src="img/rithudev.jpg" alt="" width="496" height="628" /></div>
      <i class="twinkle tw1"></i><i class="twinkle tw2"></i><i class="twinkle tw3"></i>
    </div>

    <h1 class="name"><span class="mask"><span style="--d:1.05s" id="f-name"></span></span></h1>
    <p class="turns rv" style="--d:1.35s" id="f-turns"></p>
    <p class="one" id="f-hero" aria-label="turns One"></p>
    <p class="parents rv" style="--d:2.35s" id="f-parents"></p>

    <div class="cue" id="cue"><span>Scroll</span><i></i></div>
  </section>

  <div class="js-in">
    <svg class="orn" viewBox="0 0 200 18" aria-hidden="true">
      <line x1="96" y1="9" x2="8" y2="9"/><line x1="104" y1="9" x2="192" y2="9"/>
      <rect x="96" y="5" width="8" height="8"/>
    </svg>
  </div>

  <div class="details">
    <section class="block js-in">
      <p class="label rv" id="f-dateLabel"></p>
      <p class="primary"><span class="mask"><span style="--d:.14s" id="f-dateMain"></span></span></p>
      <p class="secondary rv" style="--d:.32s" id="f-dateSub"></p>
    </section>
    <section class="block js-in">
      <p class="label rv" id="f-venueLabel"></p>
      <p class="primary"><span class="mask"><span style="--d:.14s" id="f-venueMain"></span></span></p>
      <p class="secondary rv" style="--d:.32s" id="f-venueSub"></p>
      <a class="maplink rv" style="--d:.5s" id="f-map" href="#"></a>
    </section>
  </div>

  <div class="js-in">
    <p class="closing rv" id="f-closing"></p>
  </div>

  <section class="signature js-in">
    <p class="label rv" id="f-signOff"></p>
    <p class="names"><span class="mask"><span style="--d:.16s" id="f-signNames"></span></span></p>
  </section>

</main>


<script>
(function(){
  const $=id=>document.getElementById(id);
  const set=(id,v)=>{const e=$(id); if(e) e.textContent=v;};
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  $("heroPhoto").alt=INVITE.childName;

  set("sealMark",INVITE.monogram); set("letterMark",INVITE.monogram);
  set("f-name",INVITE.childName); set("f-turns",INVITE.turnsLine);
  set("f-dateLabel",INVITE.dateLabel); set("f-dateMain",INVITE.dateMain); set("f-dateSub",INVITE.dateSub);
  set("f-venueLabel",INVITE.venueLabel); set("f-venueMain",INVITE.venueMain); set("f-venueSub",INVITE.venueSub);
  set("f-closing",INVITE.closing); set("f-signOff",INVITE.signOff);

  /* parents line may contain an ampersand entity */
  const pEl=$("f-parents");

  document.title=INVITE.heroWord+" — "+INVITE.childName;

  const heroEl=$("f-hero");
  Array.from(INVITE.heroWord).forEach(function(ch,i){
    const o=document.createElement("span"); o.className="gl";
    const n=document.createElement("span"); n.className="gi";
    n.style.setProperty("--d",(1.62+i*0.14)+"s"); n.textContent=ch;
    o.appendChild(n); heroEl.appendChild(o);
  });

  /* signature + directions link */
  const decode=str=>{ const t=document.createElement("textarea"); t.innerHTML=str; return t.value; };
  $("f-signNames").textContent=decode(INVITE.signNames);

  pEl.textContent=decode(INVITE.parents);

  const map=$("f-map");
  map.textContent=INVITE.directionsLabel;
  map.href = INVITE.mapUrl
    ? INVITE.mapUrl
    : "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(INVITE.mapQuery);
  map.target="_blank";
  map.rel="noopener noreferrer";

  if(!reduced){
    const box=$("motes");
    for(let i=0;i<20;i++){
      const m=document.createElement("i"); const s=1.5+Math.random()*3;
      m.className="mote";
      m.style.cssText="left:"+(Math.random()*100).toFixed(2)+"%;bottom:-12vh;width:"+s.toFixed(1)+
        "px;height:"+s.toFixed(1)+"px;opacity:"+(0.16+Math.random()*0.26).toFixed(2)+
        ";animation-duration:"+(22+Math.random()*26).toFixed(0)+"s;animation-delay:-"+
        (Math.random()*45).toFixed(0)+"s;";
      box.appendChild(m);
    }
    for(let i=0;i<8;i++){
      const s=document.createElement("i"); s.className="spark";
      s.style.cssText="left:"+(7+Math.random()*86).toFixed(1)+"%;top:"+(9+Math.random()*82).toFixed(1)+
        "%;animation-duration:"+(3.5+Math.random()*3.5).toFixed(1)+"s;animation-delay:-"+
        (Math.random()*6).toFixed(1)+"s;";
      box.appendChild(s);
    }
  }

  const io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  },{threshold:0.2,rootMargin:"0px 0px -6% 0px"});

  const hero=$("hero");
  let tick=false;
  function onScroll(){
    if(tick||reduced) return; tick=true;
    requestAnimationFrame(function(){
      const y=window.scrollY, p=Math.min(y/(window.innerHeight*0.85),1);
      hero.style.transform="translateY("+(y*0.10).toFixed(1)+"px)";
      hero.style.opacity=(1-p*0.78).toFixed(3);
      tick=false;
    });
  }

  const scene=$("scene"),envelope=$("envelope"),invite=$("invite"),
        hint=$("hint"),cue=$("cue"),frame=$("frame");
  let opened=false;

  function open(){
    if(opened) return; opened=true;
    Music.start();
    envelope.classList.add("opened");
    envelope.setAttribute("aria-expanded","true");
    hint.classList.add("gone");

    setTimeout(function(){
      scene.classList.add("dissolve");
      invite.setAttribute("aria-hidden","false");
      invite.classList.add("shown");
      frame.classList.add("on");
      window.scrollTo(0,0);
      requestAnimationFrame(function(){ hero.classList.add("lit"); });
      setTimeout(function(){ soundBtn.classList.add("show"); }, reduced?200:2600);

      setTimeout(function(){ heroEl.classList.add("sheening"); },
        reduced?0:1620+INVITE.heroWord.length*140+900);
      setTimeout(function(){ cue.classList.add("on"); }, reduced?200:3100);

      document.querySelectorAll(".js-in").forEach(function(el){ io.observe(el); });
      window.addEventListener("scroll",onScroll,{passive:true});
      window.addEventListener("scroll",function once(){
        cue.classList.add("off");
        window.removeEventListener("scroll",once);
      },{passive:true,once:true});

      setTimeout(function(){ scene.style.display="none"; },850);
    }, reduced?200:1900);
  }


  /* ---------- music box: "Happy Birthday", slow and bell-like ---------- */
  const Music=(function(){
    var ctx,master,wet,timer,nextT=0,step=0,on=false;
    var STEP=0.40, VOL=0.15, LEN=58;          /* eighth note at ~75bpm, 58 steps a cycle */
    var SEMI={C3:-21,F3:-16,G3:-14,
              G5:10,A5:12,B5:14,C6:15,D6:17,E6:19,F6:20,G6:22};
    /* [step, note, length in eighths] */
    var TUNE=[[0,"G5",1],[1,"G5",1],[2,"A5",2],[4,"G5",2],[6,"C6",2],[8,"B5",4],
              [12,"G5",1],[13,"G5",1],[14,"A5",2],[16,"G5",2],[18,"D6",2],[20,"C6",4],
              [24,"G5",1],[25,"G5",1],[26,"G6",2],[28,"E6",2],[30,"C6",2],
              [32,"B5",2],[34,"A5",2],[36,"F6",1],[37,"F6",1],
              [38,"E6",2],[40,"C6",2],[42,"D6",2],[44,"C6",6]];
    var CHORD=[[2,"C3"],[8,"G3"],[14,"G3"],[20,"C3"],
               [26,"C3"],[32,"G3"],[38,"F3"],[44,"C3"]];
    var mel=[],bass=[];
    TUNE.forEach(function(e){ mel[e[0]]=e; });
    CHORD.forEach(function(e){ bass[e[0]]=e[1]; });
    function hz(n){ return 440*Math.pow(2,SEMI[n]/12); }

    function impulse(sec,decay){
      var len=Math.floor(ctx.sampleRate*sec),
          buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(var c=0;c<2;c++){ var d=buf.getChannelData(c);
        for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
      return buf;
    }
    /* one struck note: triangle body + faint bell partial, long soft decay */
    function ping(freq,t,vel,dur,cut){
      var g=ctx.createGain();
      g.gain.setValueAtTime(0.00001,t);
      g.gain.linearRampToValueAtTime(vel,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.00001,t+dur);
      var f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(cut,t);
      var o1=ctx.createOscillator(); o1.type="triangle"; o1.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type="sine";     o2.frequency.setValueAtTime(freq*2.76,t);
      var pg=ctx.createGain(); pg.gain.setValueAtTime(0.13,t);
      o1.connect(f); o2.connect(pg); pg.connect(f);
      f.connect(g); g.connect(master); g.connect(wet);
      o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
    }
    function tick(){
      if(!ctx) return;
      while(nextT < ctx.currentTime+0.25){
        var i=step%LEN, m=mel[i], b=bass[i];
        if(m) ping(hz(m[1]),nextT,m[2]>3?0.185:0.16,1.5+m[2]*0.45,5200);
        if(b) ping(hz(b),nextT,0.085,3.8,760);
        step++; nextT+=STEP;
      }
    }
    function ramp(to,sec){
      var now=ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(master.gain.value,0.00001),now);
      master.gain.exponentialRampToValueAtTime(Math.max(to,0.00001),now+sec);
    }
    return {
      /* must be called inside the tap handler, or the browser blocks audio */
      start:function(){
        if(ctx) return;
        var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
        try{ ctx=new AC(); }catch(e){ return; }
        master=ctx.createGain(); master.gain.setValueAtTime(0.00001,ctx.currentTime);
        master.connect(ctx.destination);
        var conv=ctx.createConvolver(); conv.buffer=impulse(2.6,2.4);
        wet=ctx.createGain(); wet.gain.value=0.34; wet.connect(conv); conv.connect(master);
        if(ctx.state==="suspended"&&ctx.resume) ctx.resume();
        on=true; nextT=ctx.currentTime+0.9;      /* let the seal break first */
        ramp(VOL,2.4);
        tick(); timer=setInterval(tick,60);
      },
      toggle:function(){
        if(!ctx) return false;
        on=!on;
        if(on&&ctx.state==="suspended"&&ctx.resume) ctx.resume();
        ramp(on?VOL:0.00001, on?1.2:0.55);
        return on;
      },
      hide:function(){ if(ctx&&on&&ctx.state==="running"&&ctx.suspend) ctx.suspend(); },
      show:function(){ if(ctx&&on&&ctx.state==="suspended"&&ctx.resume) ctx.resume(); }
    };
  })();

  const soundBtn=$("sound");
  soundBtn.addEventListener("click",function(){
    var playing=Music.toggle();
    soundBtn.setAttribute("aria-pressed",playing?"false":"true");
    soundBtn.setAttribute("aria-label",playing?"Mute the music":"Play the music");
  });
  document.addEventListener("visibilitychange",function(){
    if(document.hidden) Music.hide(); else Music.show();
  });

  envelope.addEventListener("click",open);
  envelope.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); }
  });
})();
</script>
